name: Android APK

# Builds an installable release APK on GitHub's runners: no Expo/EAS account needed.
# Download it from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Check API configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PLANTID_API_URL: ${{ vars.PLANTID_API_URL }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$PLANTID_API_URL" ]; then
            echo "::warning::Neither the OPENAI_API_KEY secret nor the PLANTID_API_URL variable is set. The APK will build, but identifications will fail with 'No API key configured'."
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        # EXPO_PUBLIC_* values are inlined into the JS bundle during this step.
        env:
          EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXPO_PUBLIC_PLANTID_API_URL: ${{ vars.PLANTID_API_URL }}
          EXPO_PUBLIC_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk "plantid-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: plantid-apk-${{ github.run_number }}
          path: plantid-${{ github.run_number }}.apk
          retention-days: 14
          if-no-files-found: error
